# Uso (dentro de ui-ngx/):
#   docker compose -f docker-compose.build.yml run --rm build     # build:prod, saída em target/generated-resources/public
#   docker compose -f docker-compose.build.yml up ui-dev           # dev server em http://localhost:4200
name: bmamonitor-ui
services:
  build:
    image: bmamonitor-ui-build
    container_name: bmamonitor-ui-build
    build:
      context: .
      dockerfile: Dockerfile.build
      target: deps
    working_dir: /app
    command: yarn build:prod
    volumes:
      - .:/app
      - ui-node-modules:/app/node_modules
  ui-dev:
    image: bmamonitor-ui-dev
    container_name: bmamonitor-ui-dev
    build:
      context: .
      dockerfile: Dockerfile.build
      target: dev
    ports:
      - "4200:4200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://host.docker.internal:8080
    volumes:
      - .:/app
      - ui-node-modules:/app/node_modules
  # Serve o build de produção (rodar o serviço "build" ou o target "dist" antes). Sem backend: mostra login e tema.
  ui-preview:
    image: nginx:alpine
    container_name: bmamonitor-ui-preview
    ports:
      - "4200:80"
    volumes:
      - ./target/generated-resources/public:/usr/share/nginx/html:ro
      - ./nginx.preview.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  ui-node-modules:
